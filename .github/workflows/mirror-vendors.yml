name: Mirror vendor catalogs

on:
  schedule:
    - cron: '17 6 * * *' # daily, off the hour to avoid GitHub's busy top-of-hour slot
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      - run: flutter pub get
      - run: dart run tool/mirror_vendor_catalog.dart
      - name: Commit mirrored data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "No changes to mirrored vendor data."
          else
            git commit -m "Mirror vendor catalogs [automated]"
            git push
          fi
