name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match the version this project's Android Gradle/Kotlin
          # config (android/settings.gradle.kts) was validated against — a
          # newer stable Flutter raises the minimum AGP version it accepts,
          # which conflicts with the AGP/Kotlin pin needed to work around a
          # file_picker Kotlin-Gradle-Plugin build failure on newer defaults.
          flutter-version: 3.44.0
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
